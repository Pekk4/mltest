name: Build & Publish Test App

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize repo name to lowercase
        run: echo "REPO=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build & push container image
        run: |
          IMAGE=ghcr.io/${{ env.REPO }}-model:${{ github.sha }}
          docker build -t $IMAGE -t ghcr.io/${{ env.REPO }}-model:latest --push .

      - name: Install yq
        run: sudo apt-get install -y yq

      - name: Update Workflow declaration
        run: |
          yq -y -i ".metadata.name = \"wine-train-${{ github.sha }}\"" manifests/training/workflow.yaml
          yq -y -i '
            (.spec.arguments.parameters[] | select(.name == "image")).value =
            "ghcr.io/${{ env.REPO }}-model:${{ github.sha }}"
          ' manifests/training/workflow.yaml

      - name: Set Git identity
        run: |
          git config user.name "Voldemort"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Commit and push to staging
        if: github.ref == 'refs/heads/master'
        run: |
          git add manifests/training/workflow.yaml
          git commit -m "Update container image to ${{ github.sha }}" || echo "No changes to commit"
          git push
