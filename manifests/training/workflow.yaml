apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: wine-train-
  namespace: argo
spec:
  workflowTemplateRef:
    name: train-template

  arguments:
    parameters:
      - name: training_image
        value: ghcr.io/pekk4/mltest-model:latest

      - name: update_manifests_image
        value: ghcr.io/pekk4/argo-git-tools:latest

      - name: repo_url
        value: https://github.com/pekk4/mltest.git

      - name: tracking_uri
        value: http://mlflow.mlflow.svc.cluster.local

      - name: s3_endpoint
        value: http://minio.minio.svc.cluster.local:9000
