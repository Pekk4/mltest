apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wine-training
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/pekk4/mltest.git
    targetRevision: master
    path: manifests/training

  destination:
    server: https://kubernetes.default.svc
    namespace: argo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
